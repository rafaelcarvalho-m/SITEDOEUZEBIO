<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2923" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sem conexão | Colégio Estadual Euzébio da Mota</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Montserrat, Arial, sans-serif;
        color: #26322d;
        background: #f4f6f3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 620px);
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid #d8dfda;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(31 41 35 / 10%);
      }

      .school-name {
        margin: 0 0 32px;
        color: #486354;
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        color: #1f2923;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1.08;
      }

      p {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      a,
      button {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border: 2px solid #486354;
        border-radius: 999px;
        color: #fff;
        background: #486354;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      button {
        color: #26322d;
        background: #fff;
      }

      a:focus-visible,
      button:focus-visible {
        outline: 3px solid #d69b38;
        outline-offset: 3px;
      }

      @media (max-width: 480px) {
        .actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="school-name">Colégio Estadual Euzébio da Mota</p>
      <h1>Você está sem conexão</h1>
      <p>
        Não foi possível abrir esta página porque a internet caiu ou o site não
        respondeu. Confira sua conexão e tente novamente quando estiver online.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">
          Tentar novamente
        </button>
        <a href="/SITEDOEUZEBIO/">Ir para a página inicial</a>
      </div>
    </main>
  </body>
</html>
