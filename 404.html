<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A página solicitada não foi encontrada no site do Colégio Estadual Euzébio da Mota."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#1f2923" />
    <title>Página não encontrada | Colégio Estadual Euzébio da Mota</title>

    <link
      rel="shortcut icon"
      href="/imgs-home-index/icon-512-maskable.png"
      type="image/png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/paginas.css" />
  </head>

  <body class="internal-page error-page" id="inicio">
    <header class="internal-header">
      <nav class="internal-nav" aria-label="Navegação da página de erro">
        <a
          class="internal-brand"
          href="/index.html"
          aria-label="Ir para a página inicial"
        >
          <img
            src="/imgs-home-index/Cópia_de_E.M-removebg-preview.png"
            alt="Logo do Colégio Estadual Euzébio da Mota"
            width="666"
            height="374"
            decoding="async"
          />
        </a>

        <a href="/index.html">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          Voltar ao início
        </a>
      </nav>
    </header>

    <main class="error-main">
      <section class="error-hero" aria-labelledby="error-title">
        <div class="internal-container error-content">
          <p class="eyebrow">Erro 404</p>
          <p class="error-code" aria-hidden="true">404</p>

          <h1 id="error-title">Página não encontrada.</h1>

          <p class="error-message">
            O endereço pode estar incorreto ou a página pode ter sido movida.
            Você pode retornar à página inicial para continuar navegando.
          </p>

          <div class="error-actions">
            <a class="button" href="/index.html">
              Ir para a página inicial
              <i class="fa-solid fa-house" aria-hidden="true"></i>
            </a>
          </div>
        </div>
      </section>
    </main>

  </body>
</html>
